# Three replicas of a deterministic stand-in for vLLM, for the fault matrix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model
spec:
  replicas: 3
  selector: {matchLabels: {app: model}}
  template:
    metadata: {labels: {app: model}}
    spec:
      containers:
        - name: model
          image: thaipoai/fake-model:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
        - name: adapter-sync
          image: thaipoai/adapter-sync:dev
          imagePullPolicy: Never
          args: ["--dir=/adapters", "--backend=http://127.0.0.1:8000", "--interval=1s", "--retry=3s"]
          ports: [{containerPort: 8090, name: state}]
          livenessProbe: {httpGet: {path: /healthz, port: state}}
          readinessProbe: {httpGet: {path: /readyz, port: state}, periodSeconds: 1}
          volumeMounts:
            - {name: adapters, mountPath: /adapters}
            - {name: desired, mountPath: /etc/adapter-sync}
      volumes:
        - {name: adapters, emptyDir: {}}
        - {name: desired, configMap: {name: rollout-translate, optional: true}}
