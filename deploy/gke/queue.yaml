# Rendered with envsubst by .github/workflows/train.yml.
apiVersion: v1
kind: Namespace
metadata:
  name: thaipoai
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: spot-gpu
spec:
  nodeLabels:
    cloud.google.com/gke-spot: "true"
    cloud.google.com/gke-accelerator: ${GPU_ACCELERATOR}
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: training
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: spot-gpu
          resources:
            - name: cpu
              nominalQuota: ${JOB_CPU}
            - name: memory
              nominalQuota: ${JOB_MEMORY}
            - name: nvidia.com/gpu
              nominalQuota: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: training
  namespace: thaipoai
spec:
  clusterQueue: training
