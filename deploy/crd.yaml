# One object per target, and its name is the target. The API server enforces the rules, so
# there is no admission webhook to run or to race:
#  - names are unique, so a target has one rollout object
#  - the rule below refuses a new spec until the controller has finished the current one
# status has its own subresource, so a user who can edit the spec cannot type a stable model.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelrollouts.thaipoai.dev
spec:
  group: thaipoai.dev
  names: {kind: ModelRollout, listKind: ModelRolloutList, plural: modelrollouts, singular: modelrollout, shortNames: [mr]}
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Candidate, type: string, jsonPath: .spec.model.name}
        - {name: Stable, type: string, jsonPath: .status.stable.name}
        - {name: Reason, type: string, jsonPath: .status.reason}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: >-
                (self.spec.model.sha256 == oldSelf.spec.model.sha256 && self.spec.model.name == oldSelf.spec.model.name &&
                self.spec.attempt == oldSelf.spec.attempt &&
                self.spec.canary.percent == oldSelf.spec.canary.percent && self.spec.canary.minSamples == oldSelf.spec.canary.minSamples &&
                self.spec.canary.timeoutMinutes == oldSelf.spec.canary.timeoutMinutes) ||
                (has(oldSelf.status) && has(oldSelf.status.observed) && has(oldSelf.status.phase) &&
                has(oldSelf.status.observedAttempt) && oldSelf.status.observed == oldSelf.spec.model.sha256 &&
                oldSelf.status.observedAttempt == oldSelf.spec.attempt &&
                oldSelf.status.phase in ['Promoted', 'Blocked', 'RolledBack', 'Inconclusive'])
              message: a rollout is in progress on this target, and its spec cannot change until it finishes
          properties:
            spec:
              type: object
              required: [model]
              properties:
                model:
                  type: object
                  required: [name, sha256]
                  properties:
                    name: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,40}$', maxLength: 41}
                    sha256: {type: string, pattern: '^[0-9a-f]{64}$', maxLength: 64}
                attempt: {type: integer, minimum: 0, default: 0, description: Raise this to retry the same model.}
                canary:
                  type: object
                  default: {}
                  properties:
                    percent: {type: integer, minimum: 1, maximum: 50, default: 10}
                    minSamples: {type: integer, minimum: 1, default: 100}
                    timeoutMinutes: {type: integer, minimum: 1, default: 60}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                observed: {type: string, maxLength: 64}
                observedAttempt: {type: integer}
                phase: {type: string, maxLength: 20}
                reason: {type: string, maxLength: 500}
                previous:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                stable:
                  type: object
                  properties:
                    name: {type: string, maxLength: 41}
                    sha256: {type: string, maxLength: 64}
