[project]
name = "thaipoai"
version = "0.1.0"
description = "A Thai-English translator trained from scratch in MLX"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx>=0.32.4",
  "sentencepiece",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
