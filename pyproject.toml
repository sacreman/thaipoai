[project]
name = "thaipoai"
version = "0.1.0"
description = "Replacing hosted translation with a model we run ourselves"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.10.0",
  "transformers>=5.6.0",
  "peft>=0.18.1",
  "accelerate>=1.11.0",
  "safetensors",
  "sentencepiece",
  "protobuf",
  "huggingface-hub",
]

[dependency-groups]
dev = ["pytest"]
mac = [
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
