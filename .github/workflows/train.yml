name: train
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: l4 for LoRA, a100 for full-weight training
        type: choice
        options: [l4, a100]
        default: l4
      job_hours:
        description: Kubernetes Job deadline in whole hours, 1 to 20
        type: string
        default: "4"
      dataset:
        description: Name under datasets/ in the bucket
        type: string
        default: throwaway
permissions:
  contents: read
  id-token: write
concurrency:
  group: gpu-train
  cancel-in-progress: false
env:
  RUN_ID: r${{ github.run_id }}
  PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  BUCKET: ${{ secrets.GCP_BUCKET }}
  TRAINER_IMAGE: ${{ secrets.TRAINER_IMAGE }}
  REGION: ${{ vars.GCP_REGION }}
  ZONE: ${{ vars.GCP_ZONE }}
  GPU: ${{ inputs.gpu }}
  JOB_HOURS: ${{ inputs.job_hours }}
  DATASET: ${{ inputs.dataset }}
  KUEUE_VERSION: v0.19.9
  TERRAFORM_VERSION: 1.15.4
jobs:
  # The only job a reviewer approves. Each job naming a reviewed environment stops for approval,
  # so everything after this uses gpu-run: teardown must never wait for a person.
  preflight:
    runs-on: ubuntu-latest
    environment: gpu
    timeout-minutes: 15
    outputs:
      deadline_epoch: ${{ steps.check.outputs.deadline_epoch }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - id: check
        run: deploy/gke/preflight.sh

  provision:
    needs: preflight
    runs-on: ubuntu-latest
    environment: gpu-run
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Create the cluster
        working-directory: infra/run
        env:
          TF_IN_AUTOMATION: "1"
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_run_id: r${{ github.run_id }}
          TF_VAR_gpu: ${{ inputs.gpu }}
          TF_VAR_deadline_epoch: ${{ needs.preflight.outputs.deadline_epoch }}
        run: |
          export TF_VAR_job_deadline_seconds=$((JOB_HOURS * 3600))
          terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="prefix=tfstate/$RUN_ID"
          terraform apply -input=false -auto-approve
      - name: Install Kueue
        run: |
          gcloud container clusters get-credentials "thaipoai-$RUN_ID" --project "$PROJECT" --zone "$ZONE"
          kubectl apply --server-side -f "https://github.com/kubernetes-sigs/kueue/releases/download/$KUEUE_VERSION/manifests.yaml"
          kubectl -n kueue-system rollout status deployment/kueue-controller-manager --timeout=300s
      - name: Submit the Job
        run: |
          case "$GPU" in
            l4)   export GPU_ACCELERATOR=nvidia-l4 JOB_CPU=6 JOB_MEMORY=24Gi ;;
            a100) export GPU_ACCELERATOR=nvidia-tesla-a100 JOB_CPU=9 JOB_MEMORY=70Gi ;;
          esac
          export JOB_DEADLINE_SECONDS=$((JOB_HOURS * 3600)) GIT_SHA="$GITHUB_SHA"
          export DATASET_URI="gs://$BUCKET/datasets/$DATASET" OUTPUT_URI="gs://$BUCKET/runs/$RUN_ID"
          # Kueue's webhook answers a little after its deployment reports ready.
          for attempt in $(seq 12); do
            envsubst '$GPU_ACCELERATOR $JOB_CPU $JOB_MEMORY' <deploy/gke/queue.yaml | kubectl apply -f - && break
            if [ "$attempt" = 12 ]; then exit 1; fi
            sleep 15
          done
          # Applying again would set suspend back to true on a Job Kueue has already released.
          if ! kubectl -n thaipoai get job thaipoai-train >/dev/null 2>&1; then
            envsubst '$RUN_ID $GIT_SHA $TRAINER_IMAGE $DATASET_URI $OUTPUT_URI $JOB_DEADLINE_SECONDS $JOB_CPU $JOB_MEMORY' <deploy/gke/job.yaml | kubectl create -f -
          fi

  # Legs run one at a time, each under the six-hour hosted limit. They hold no state, so a
  # leg that finds the Job finished ends at once.
  poll:
    needs: provision
    runs-on: ubuntu-latest
    environment: gpu-run
    timeout-minutes: 345
    strategy:
      max-parallel: 1
      matrix:
        leg: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - run: gcloud container clusters get-credentials "thaipoai-$RUN_ID" --project "$PROJECT" --zone "$ZONE"
      - run: deploy/gke/poll.sh

  gate:
    needs: poll
    runs-on: ubuntu-latest
    environment: gpu-run
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin,kubectl
      - name: Check the Job finished
        run: |
          gcloud container clusters get-credentials "thaipoai-$RUN_ID" --project "$PROJECT" --zone "$ZONE"
          kubectl -n thaipoai get job thaipoai-train -o json |
            jq -e '[.status.conditions[]? | select(.type == "Complete" and .status == "True")] | length == 1' >/dev/null
      - name: Eval gate
        run: |
          gcloud storage cat "gs://$BUCKET/runs/$RUN_ID/eval.json" >eval.json
          jq -e --arg run "$RUN_ID" '.run_id == $run and .passed == true and (.dataset_hash | type == "string" and length > 0) and (.metrics | type == "object")' eval.json >/dev/null
      - name: Upload the passing adapter
        run: |
          gcloud storage cp --recursive "gs://$BUCKET/runs/$RUN_ID/adapter/*" "gs://$BUCKET/adapters/$RUN_ID/"
          # Written last: an adapter with a manifest is a complete one.
          gcloud storage cat "gs://$BUCKET/ledger/$RUN_ID.json" |
            jq --slurpfile eval eval.json --argjson now "$(date +%s)" --arg sha "$GITHUB_SHA" \
              '{run_id, gpu, git_sha: $sha, dataset_hash: $eval[0].dataset_hash, metrics: $eval[0].metrics, cost_ceiling_usd: (((.rate_usd_per_hour * ($now - .started_epoch) / 3600) * 100 | round) / 100)}' |
            gcloud storage cp - "gs://$BUCKET/adapters/$RUN_ID/manifest.json"

  teardown:
    needs: [preflight, provision, poll, gate]
    if: always()
    runs-on: ubuntu-latest
    environment: gpu-run
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: deploy/gke/teardown.sh
