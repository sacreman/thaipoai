name: fault-matrix
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go install sigs.k8s.io/kind@v0.29.0
      - run: deploy/kind/up.sh
      - run: deploy/kind/fault-matrix.sh
