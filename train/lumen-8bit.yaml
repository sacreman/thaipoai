# QLoRA on 8-bit Lumen, matching the settings used for the other models where possible.
model: models/lumen-8bit
train: true
data: runs/mlx-data
adapter_path: adapters/lumen8
fine_tune_type: lora
optimizer: adamw
batch_size: 4
iters: 100
learning_rate: 5.0e-5  # 2e-4 diverged: mlx_lm.lora applies no gradient clipping
grad_checkpoint: true
mask_prompt: true
max_seq_length: 512
num_layers: 40
steps_per_report: 10
steps_per_eval: 100000
val_batches: 1
save_every: 100
seed: 0
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]
  rank: 64
  scale: 2.0
  dropout: 0.05
